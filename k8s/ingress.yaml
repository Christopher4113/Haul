apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: haul-api
  namespace: haul
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: haul-api
                port:
                  number: 8080
